[mypy]
# execution/ and config/ have no __init__.py — every script self-inserts the repo root on
# sys.path instead. Without this, mypy maps execution/notifier.py to two module names and
# stops with "Source file found twice" before checking anything (TODO 2026-09-15), so
# `mypy execution/` reported one error and hid the real ones.
explicit_package_bases = True
