# ============================================================
# TRADING SYSTEM — STRATEGY PARAMETERS
# Edit these values to configure system behavior.
# Placeholders marked [FILL_IN] must be set before going live.
# ============================================================

hardware:
  cpu_threshold_pct: 85          # Pause non-essential tasks above this CPU %
  temp_threshold_c: 80           # Alert and pause above this CPU temp (Celsius)
  poll_interval_seconds: 30      # How often to sample hardware metrics

intelligence:
  min_confidence_score: 0.72     # Minimum advisor confidence to execute (0.0–1.0)

# Poll intervals for external intelligence feeds. The loop runs every ~60s, and
# whale/policy were re-fetched on EVERY cycle — ~390 requests/day to each source.
# That is almost certainly what earned the CapitolTrades 429 in the first place,
# and it produced 300+ identical error lines per session. These are daily-cadence
# disclosure sources; polling them every 60s buys nothing. Cooldowns are persisted
# in agent_state.json so a restart loop can't reset them and resume hammering.
feeds:
  whale_poll_minutes: 30
  policy_poll_minutes: 15
  fetch_error_log_cooldown_minutes: 60   # Log a repeated fetch failure at most this often

whale_watch:
  source_url: "https://www.capitoltrades.com/trades"
  politician_names:
    # Currently active — verified on Capitol Trades 2026-04-09
    - "Rich McCormick"        # Most active: ABT, BLK, HD, ADI, ADP buys
    - "Mike Kelly"            # Large muni/bond trades — watch for equity pivots
    - "Sheldon Whitehouse"    # Sold PEP — watch rotation
    # High historical alpha (2025 returns per Motley Fool research)
    - "Warren Davidson"       # 78.8% return in 2025
    - "Donald Norcross"       # 70.8% return in 2025
    - "Terri Sewell"          # 67.9% return in 2025
    # Long-term tracked
    - "Nancy Pelosi"          # Historically strong returns, tech focus
    - "Dan Crenshaw"          # Energy/defense committee exposure
    - "Tommy Tuberville"      # Agriculture/banking committee
    - "Marjorie Taylor Greene"
    - "Josh Gottheimer"
  whale_trade_min_value: 15000   # Lowered from 50K — captures $15K–$50K range
  max_portfolio_pct_per_trade: 5 # Max % of portfolio per whale signal
  roc_lookback_minutes: 5        # 1-min bars to compute Rate of Change

position_management:
  close_profit_pct: 50          # Buy to close when premium decays >= this % (50% max profit rule)
  roll_dte_threshold: 21        # Roll when DTE <= this and not at profit target
  force_close_dte: 7            # Always close (no exceptions) when DTE <= this
  roll_weeks_out: 4             # How many weeks to roll to
  stop_loss_pct: 250            # Buy to close a short PUT once loss >= this % of premium received (caps blowups; 0 disables)
  roll_otm_buffer: 0.05         # Roll down-and-out: new put strike <= spot * (1 - this), and never above the old strike
  min_roll_credit: 0.15         # $/share — a roll below this is a fee generator with delta risk, not a trade; close instead
  min_hold_hours: 24            # Never ROLL a position opened less than this long ago (stop-loss / profit-close exempt)

morning_briefing:
  enabled: true
  hour_et: 9                    # Fire at 9 AM ET
  minute_cutoff: 30             # Must be before 9:30 (market open)
  min_conviction_highlight: 6   # NotebookLM signals above this go in the briefing
  max_trade_ideas: 3            # Max specific trade ideas to generate

signal_convergence:
  strong_buy_accounts: ["B", "C"]   # Accounts to use for convergence plays
  whale_min_for_convergence: 25000  # Minimum whale trade $ for convergence signal
  policy_tiers_actionable: [1, 2]   # Policy tiers that trigger convergence check
  notebooklm_min_conviction: 7      # Minimum NLM conviction for convergence

wheel:
  # ============================================================
  # UNIVERSE REBUILD (2026-08-07) — sized to the account, not to ambition.
  #
  # A CSP needs strike x 100 of collateral. Against $86k equity the 15% per-trade
  # cap is $12,870, so any underlying above ~$137 cannot be wheeled with even ONE
  # contract. Eleven of the twenty names were in that state (CAT needed $80,550)
  # and simply never traded — silently, with no order and no explanation.
  #
  # The parked list below keeps them (and their rationale) recoverable: restore a
  # name when equity supports it, or when its price comes back into range. They
  # stay in risk.sector_map so any equity still held keeps counting against caps.
  #
  # NOTE: added names start with ZERO IV history and the IV gate is hard, so they
  # cannot trade until iv_tracker accrues MIN_HISTORY_DAYS (15) of snapshots —
  # roughly three trading weeks from 2026-08-10. This is a medium-term change.
  # ============================================================
  tickers:
    # === DEFENSE / AI (Tier 1) ===
    - "SHLD"   # Defense Tech ETF — full basket, lowest risk
    - "LDOS"   # Leidos — steady gov contractor
    - "KTOS"   # Drone autonomy, Skyborg program, DoD pipeline
    - "RKLB"   # SpaceX competitor, Space Force contracts
    # === SPACE GROWTH (Tier 1b) — high IV, liquid chains, own correlation bucket ===
    - "LUNR"   # Intuitive Machines — lunar lander contracts; bid $1.07 vs $0.15 floor
    - "ASTS"   # AST SpaceMobile — direct-to-cell constellation; bid $3.53 vs $0.54 floor
    # === NUCLEAR RENAISSANCE (Tier 3) ===
    - "CCJ"    # Cameco — uranium, nuclear fuel chain
    - "OKLO"   # Oklo — SMR buildout; bid $1.86 vs $0.36 floor
    - "SMR"    # NuScale Power — first NRC-certified SMR design
    - "UUUU"   # Energy Fuels — US uranium + rare earth processing
    - "NNE"    # Nano Nuclear Energy — microreactor development
    # === CRITICAL MINERALS (Tier 4) ===
    - "MP"     # MP Materials — only active US rare earth mine, 15% gov stake
    - "ALB"    # Albemarle — lithium, critical minerals
    - "AA"     # Alcoa — domestic aluminium, tariff beneficiary
    - "FCX"    # Freeport-McMoRan — copper, grid/electrification demand
    - "CLF"    # Cleveland-Cliffs — US steel, tariff beneficiary
    # === ENERGY (Tier 2) ===
    - "APA"    # APA Corp — only major that cleared the credit floor at this expiry
    # === BORDER SECURITY (Tier 6) ===
    - "GEO"    # GEO Group — ICE detention, $38.3B govt plan
    # === TARIFF DEFENSIVE (Tier 7) ===
    - "ABT"    # Abbott — healthcare defensive, congress buying
    - "CSCO"   # Cisco — networking/AI infra; bid $2.07 vs $0.91 floor
    # === RECENT-IPO WATCHLIST — quarantined; excluded at candidate generation ===
    - "FJET"   # Starfighters Space — equity starter held
    - "OPTX"   # Syntec Optics — equity starter held
    - "AADX"   # Applied Aerospace & Defense — equity starter held
    #
    # --- PARKED: one contract exceeds the per-trade cap at current equity ---
    # Restore when equity grows or price falls back under ~$137.
    #   "CAT"   $859  -> $80,550 collateral  (infrastructure, domestic industrial)
    #   "GLD"   $391  -> $36,700             (stagflation hedge)
    #   "HD"    $348  -> $32,600             (domestic sourcing, congress double-buy)
    #   "NUE"   $272  -> $25,500             (US steel, tariff beneficiary)
    #   "CEG"   $263  -> $24,700             (largest US nuclear fleet, +Calpine)
    #   "RTX"   $223  -> $20,900             ($218B backlog)
    #   "LEU"   $191  -> $17,950             (uranium enrichment — validated, too big)
    #   "CVX"   $189  -> $17,750             (oil major)
    #   "AVAV"  $187  -> $17,500             (drones — IV rank 100%, the painful one)
    #   "BWXT"  $170  -> $15,950             (naval nuclear — validated, too big)
    #   "PLTR"  $172  -> $14,700             (AI battlespace; also no puts at 2wk expiry)
    #   "XOM"   $155  -> $14,500             (lagging oil rally)
    #   "VST"   $143  -> $13,350             (20yr PPAs, 6.6GW expansion)
    # AVOID entirely: AAPL (China), NVDA (export ban), SPY (trend unclear),
    #                 LMT/NOC (wide spreads at ATH)
  target_delta: 0.25             # Tightened from 0.30 — more conservative in volatile market
  expiration_weeks: 2            # Weeks to expiration at entry
  cc_strike_markup_pct: 2.0      # CC strike = cost_basis * (1 + this/100)
  min_premium_pct: 0.8           # Raised from 0.5 — elevated IV means we can demand more
  max_portfolio_pct_per_trade: 15.0  # Max % of equity per CSP (e.g. 15% of $100k = $15k/position)
  max_wheel_allocation_pct: 65       # Stop opening new CSPs above this % of equity in margin
  # TEMPORARY 0.30 -> 0.15 (2026-08-07). REVISIT 2026-12-01 and restore to 0.30.
  # IV rank is computed against stored history only, and iv_history holds just
  # 19–26 snapshot days for most tickers (48 max, first row 2026-05-28). A 30%
  # floor against a ~1-month lookback is far stricter than the same number against
  # the conventional 52-week range: a short window compresses the range, so a
  # quiet month pushes almost everything toward its recent floor. That is why 12
  # of 20 names printed IVR < 30% (several at 0–10%) while genuinely rich names
  # existed. This lowers the bar to match the evidence available, not to take more
  # risk — the credit floor, earnings gate and risk gate are all unchanged.
  min_iv_rank: 0.15                  # Derivatives gate: only sell CSPs when IV rank >= 15%
  iv_gate_fail_open: false           # false = HARD gate: no IV history → no trade. Sitting in cash is allowed.
  min_credit_per_share: 0.15         # Absolute floor on CSP entry credit ($/share, from real NBBO bid)
  earnings_gate: true                # Never open a CSP whose expiry window contains an earnings date (needs FINNHUB_API_KEY; fail-open without it)
  # --- Sizing (2026-08-07) -------------------------------------------------
  # The wheel used to submit qty=1 unconditionally, so a name whose caps allowed
  # 4 contracts still sold 1 and left 75% of its authorized capacity unused. The
  # book sat at 13.8% allocation against a 65% budget. Sizing now fills to the
  # SMALLEST of: per-trade cap, sector headroom, total allocation headroom, and
  # this hard contract ceiling. No risk limit is loosened — the same caps bind,
  # they just stop being under-used.
  max_contracts_per_trade: 4         # Hard ceiling per CSP regardless of what the caps allow
  prioritize_by_iv_rank: true        # Evaluate richest-premium names FIRST so scarce collateral
                                     # goes to the best premium (GEO at IVR 20% was taking capital
                                     # while AVAV at IVR 100% went unfilled)
  skip_log_cooldown_minutes: 240     # Log the same (ticker, reason) skip at most this often.
                                     # Was logging every ~65s → 150–320 duplicate entries/day.
  # Policy → execution pathway (2026-08-07). Policy monitor flagged 19 tickers in
  # one week and produced zero orders because the wheel only ever read the list
  # above. Signal-flagged tickers now become CANDIDATES — they still clear the IV
  # floor, credit floor, earnings gate and risk caps, and are still sized by the
  # same headroom math. A promoted name cannot trade until iv_tracker has accrued
  # 15 snapshots for it. See execution/dynamic_universe.py.
  use_signal_candidates: true

protection:
  trailing_stop_pct: 7.0         # Trailing stop on all equity positions (%)
  gap_tighten_pct: 3.0           # Additional tightening on gap-down signal (%)
  ladder_drop_pct: 5.0           # Drawdown % from the last rung (or entry) to trigger the next ladder buy
  ladder_buy_shares: 10          # Shares per ladder buy
  max_ladder_rungs: 3            # Hard cap: at most this many ladder buys per ticker (prevents runaway)
  no_auto_manage: ["FJET", "OPTX", "AADX"]  # IPO starters — no trailing stop / no ladder (manual breakeven exit)

guardrails:
  manual_confirm_threshold: 5000 # Orders above this $ require explicit CONFIRM
  verification_trades: 0         # 0 = fully autonomous, no manual confirm required
  api_retry_limit: 3             # Consecutive API failures before full halt
  paper_mode: true               # Set false only when ready for live trading

# ============================================================
# PRE-TRADE RISK GATE (2026-07-06) — the FJET lesson.
# Every equity order and every new CSP passes through execution/risk_gate.py
# BEFORE submission. A signal module can propose a trade; only the gate can
# size it. These are hard rejects, not journal observations.
# ============================================================
risk:
  max_position_pct: 5.0              # No equity order may push one ticker past this % of equity
  quarantine_max_position_pct: 1.0   # Cap for quarantined (IPO/speculative) tickers
  quarantined_tickers:               # Auto-includes protection.no_auto_manage (IPO starters)
    - "FJET"
    - "OPTX"
    - "AADX"
  sector_cap_pct: 20.0               # Max % of equity in one correlated sector (equity value + CSP collateral)
  deadman_cancel_orders: true        # Stale heartbeat during market hours → watchdog cancels all open orders
  sector_map:                        # Correlated-exposure buckets; unmapped tickers get only the position cap
    defense_aerospace: ["SHLD", "RTX", "AVAV", "PLTR", "LDOS", "KTOS", "RKLB"]
    # Speculative IPO micro-caps get their OWN bucket. They were in defense_aerospace,
    # where FJET's dead $18.1k equity position (21.1% of equity) single-handedly put the
    # bucket over the 20% cap and hard-blocked CSPs on all 7 defense primes for weeks —
    # including AVAV at IV rank 100%, the journal's top-flagged missed trade. These names
    # are a correlated speculative cluster, not defense primes: a Starfighters Space
    # micro-cap does not hedge or correlate with an RTX short put. The cap still counts
    # their exposure in full — it just stops it from consuming an unrelated budget.
    space_micro:       ["FJET", "OPTX", "AADX"]
    # Speculative space growth names are correlated with each other (risk-on space
    # sentiment), not with the primes — and must NOT share space_micro, whose budget
    # FJET has already blown. Their own bucket caps the pair without either problem.
    space_growth:      ["LUNR", "ASTS"]
    energy_commodity:  ["XOM", "CVX", "GLD", "NUE", "CAT", "APA"]
    nuclear_uranium:   ["CCJ", "CEG", "VST", "OKLO", "SMR", "UUUU", "NNE", "LEU"]
    critical_minerals: ["MP", "ALB", "AA", "FCX", "CLF"]
    defensive:         ["ABT", "HD", "GEO", "CSCO"]
    # Parked tickers stay mapped above: they may still be held as equity, and that
    # exposure must keep counting against its sector cap even when un-wheelable.

# Live-money gates — checked in code (execution/live_readiness.py) before
# --mode live will start. Defined now, while still on paper, so the bar
# can't be lowered in the heat of the moment.
live_gates:
  min_days_since_critical_alert: 60  # 60 consecutive trading days with zero critical alerts
  min_profit_factor: 1.3             # Over the paper history window
  max_drawdown_pct: 8.0              # Max peak-to-trough equity drawdown in the window
  history_window_days: 90            # ~3 months of paper history
  initial_capital_fraction: 0.25     # Go live at 25% of capital first (reported, not enforced)

notifications:
  alert_email: "[FILL_IN]"       # e.g. you@yourdomain.com
  daily_report_time: "16:15"     # 4:15 PM local market time
  status_check_interval_hours: 2 # Send a status email every N hours during market window
  timezone: "America/New_York"

regime:
  bear_spy_threshold: -2.0       # SPY intraday % → BEAR (half allocation, wider delta)
  extreme_spy_threshold: -4.0    # SPY intraday % → EXTREME_BEAR (no new entries)

hedge:
  enabled: true
  tickers:
    - "SQQQ"                     # 3x inverse Nasdaq — swap for "SH" for lower vol
  allocation_pct: 3.0            # % of equity per ticker in BEAR regime
  extreme_multiplier: 2.0        # multiply allocation in EXTREME_BEAR

database:
  table: "decision_logic"
  state_file: "./logs/agent_state.json"
